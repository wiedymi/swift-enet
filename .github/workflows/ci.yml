name: Swift
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test -Xswiftc -strict-concurrency=complete
      - run: swift test -c release -Xswiftc -strict-concurrency=complete
  thread-sanitizer:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --sanitize=thread -Xswiftc -strict-concurrency=complete
